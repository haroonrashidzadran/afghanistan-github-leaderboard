name: Update Leaderboard

on:
  schedule:
    # Run every 24 hours at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            package.json
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run leaderboard update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm start
      
      - name: Commit changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add README.md leaderboard.json
          git diff --stat
          if [ -n "$(git diff --name-only)" ]; then
            git commit -m "Update leaderboard - $(date '+%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          else
            echo "No changes to commit"
          fi
      
      - name: Push changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          force: false
      
      - name: Create Pull Request (optional)
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v6
        with:
          title: '🤖 Auto-update leaderboard'
          body: 'This PR was automatically created by the update-leaderboard workflow.'
          branch-suffix: timestamp
          delete-branch: true
